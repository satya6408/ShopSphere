
server {
    listen 80;
    server_name localhost;

    # Serve frontend
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ =404;
    }

    # Product Service reverse proxy
    location /api/products {
        proxy_pass http://product-service:8001/products;
    }

    # Cart Service reverse proxy
    location /api/cart {
        proxy_pass http://cart-service:8002/cart;
    }
}
