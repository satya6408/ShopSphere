services:

  # Product Microservice
  product-service:
    image: ${DOCKERHUB_USERNAME:-satya6408}/shopsphere-product:${IMAGE_TAG:-latest}
    container_name: shopsphere-product
    expose:
      - "8001"
    environment:
      MYSQL_HOST: db
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  # Cart Microservice
  cart-service:
    image: ${DOCKERHUB_USERNAME:-satya6408}/shopsphere-cart:${IMAGE_TAG:-latest}
    container_name: shopsphere-cart
    expose:
      - "8002"
    environment:
      MYSQL_HOST: db
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  # Frontend and Nginx Reverse Proxy
  frontend:
    image: ${DOCKERHUB_USERNAME:-satya6408}/shopsphere-frontend:${IMAGE_TAG:-latest}
    container_name: shopsphere-frontend
    ports:
      - "80:80"
    depends_on:
      - product-service
      - cart-service
    restart: unless-stopped

  # MySQL Database
  db:
    image: ${DOCKERHUB_USERNAME:-satya6408}/shopsphere-database:${IMAGE_TAG:-latest}
    container_name: shopsphere-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$${MYSQL_ROOT_PASSWORD} || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  mysql_data:
